name: aurafit
services:
  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_DB: aurafit
      POSTGRES_USER: aurafit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - aurafit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurafit -d aurafit"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [internal]
  api:
    build: .
    environment:
      AURAFIT_DATABASE_URL: ${AURAFIT_DATABASE_URL:?Set AURAFIT_DATABASE_URL in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "${AURAFIT_BIND_ADDRESS:-127.0.0.1}:${AURAFIT_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [internal]
networks:
  internal:
volumes:
  aurafit_pgdata:
