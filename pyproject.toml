[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurafit"
version = "0.5.0"
description = "AuraFit causal wellness feature engineering and experimental prediction"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3", "psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2", "tzdata>=2024.1", "numpy>=2,<3", "scikit-learn>=1.6,<2", "joblib>=1.4,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
llm = ["langchain-core>=0.3,<2", "langchain-openai>=0.3,<2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
aurafit = "aurafit.cli:main"
aurafit-sim = "aurafit.synthetic_cli:main"
aurafit-ml = "aurafit.ml_cli:main"
aurafit-key = "aurafit.key_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
